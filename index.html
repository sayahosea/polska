<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jeszcze Polska nie zginęła</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">

  <style>
    :root {
      --white: #ffffff;
      --red: #dc143c;
      --ink: rgb(0 0 0 / 0.65);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { min-height: 100%; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(1.25rem, 4vw, 2.5rem);
      padding: clamp(1rem, 4vw, 3rem);
      font-family: Georgia, "Times New Roman", serif;
      background: linear-gradient(to bottom, var(--white) 50%, var(--red) 50%);
      background-attachment: fixed;
    }

    .eagle {
      --h: clamp(220px, 48vmin, 520px);
      height: var(--h);
      aspect-ratio: 3158 / 3716;
      max-width: 80vw;
      padding: clamp(0.5rem, 1.5vmin, 1rem);
      background: rgb(0 0 0 / 0.65);
      border-radius: 1em;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    .eagle img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    h1 {
      max-width: 22ch;
      padding: 0.6em 1em;
      background: var(--ink);
      color: var(--white);
      border-radius: 0.3em;
      font-size: clamp(1.6rem, 6vw, 3.5rem);
      line-height: 1.2;
      text-align: center;
      text-wrap: balance;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    @media (orientation: landscape) and (max-height: 500px) {
      body {
        flex-direction: row;
        gap: 2rem;
      }
      .eagle { --h: 70vh; max-width: 40vw; }
      h1 { font-size: clamp(1.3rem, 4vw, 2.2rem); }
    }
  </style>
</head>
<body>

  <div class="eagle">
    <img src="/white_eagle.svg" alt="Biały Orzeł – the White Eagle of Poland">
  </div>

  <h1>Jeszcze Polska nie zginęła</h1>

</body>
</html>
